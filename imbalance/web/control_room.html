<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imbalance Outlook</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090C}
.m{font-family:'JetBrains Mono',ui-monospace,monospace}
.lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase}
.hud{position:relative}
.hud::before,.hud::after{content:"";position:absolute;width:9px;height:9px;border-color:#4A5462;border-style:solid;pointer-events:none}
.hud::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.hud::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
@keyframes pulse{0%,100%{opacity:0.55}50%{opacity:1}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,92,108,0.55)}100%{box-shadow:0 0 0 8px rgba(255,92,108,0)}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ping{animation:ping 1.8s ease-out infinite}
@media (prefers-reduced-motion: reduce){.pulse,.ping,.tick{animation:none}}
</style>

<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div :style="`min-height: 1900px; background: ${t.bg}; color: ${t.text}; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased`">

<!-- ============ TOP BAR ============ -->
<header :style="`display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; border-bottom: 1px solid ${t.border}; background: ${t.surf}`">
  <div :style="`display: flex; align-items: center; gap: 10px; padding: 8px 18px; border-right: 1px solid ${t.border}`">
    <span aria-hidden="true" :style="`width: 10px; height: 10px; background: ${t.acc}`"></span>
    <span style="display: flex; flex-direction: column"><span class="m" style="font-weight: 600; font-size: 14px; letter-spacing: 0.06em">IMBALANCE OUTLOOK</span>
    <span class="m" :style="`font-size: 12px; letter-spacing: 0.08em; color: ${t.text3}`">FI · {{dataTag}}</span></span>
  </div>
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 8px 20px; flex: 1 1 600px">
    <nav aria-label="Views" style="display: flex; gap: 2px"><button type="button" @click="setTabOv" class="lbl" :style="`border: 0; background: none; cursor: pointer; color: ${tabOvFg}; border-bottom: 2px solid ${tabOvLine}; padding: 6px 10px`">Overview</button><button type="button" @click="setTabCr" class="lbl" :style="`border: 0; background: none; cursor: pointer; color: ${tabCrFg}; border-bottom: 2px solid ${tabCrLine}; padding: 6px 10px`">Control room</button></nav>
    <div style="flex: 1 1 20px"></div>

    <div role="group" aria-label="Point of review" style="display: flex; align-items: center; gap: 6px">
      <span class="lbl" :style="`color: ${t.text3}`">As of</span>
      <select @change="pickDay" aria-label="Day" class="m" :style="`height: 32px; border: 1px solid ${t.border}; background: ${t.bg}; color: ${t.text}; font-size: 12px`"><template v-for="d in dayOpts"><option :value="d.v" :selected="d.on">{{d.label}}</option></template></select>
      <button type="button" @click="back" aria-label="One hour back" aria-keyshortcuts="ArrowLeft" :style="`width: 32px; height: 32px; border: 1px solid ${t.border}; background: ${t.surf2}; color: ${t.text}; cursor: pointer; font-size: 12px`">◀</button>
      <div class="m" :style="`min-width: 158px; height: 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid ${asOfBorder}; padding: 0 10px; font-size: 13px; background: ${t.bg}`">
        <span>{{asOfLabel}}</span><span :style="`color: ${t.text3}; font-size: 12px`">{{tzName}}</span>
      </div>
      <button type="button" @click="fwd" :disabled="fwdDisabled" aria-label="One hour forward" aria-keyshortcuts="ArrowRight" :style="`width: 32px; height: 32px; border: 1px solid ${t.border}; background: ${t.surf2}; color: ${fwdColor}; cursor: pointer; font-size: 12px`">▶</button>
      <div role="group" aria-label="Mode" :style="`display: flex; border: 1px solid ${t.border}; margin-left: 4px`">
        <button type="button" @click="goLive" :aria-pressed="isLive" class="lbl" :style="`height: 30px; padding: 0 12px; border: 0; background: ${liveBg}; color: ${liveFg}; cursor: pointer; display: flex; align-items: center; gap: 6px`"><span aria-hidden="true" :class="liveCls" :style="`width: 7px; height: 7px; border-radius: 50%; background: ${liveDot}`"></span>Browse</button>
        <button type="button" @click="goReplay" :aria-pressed="isPast" class="lbl" :style="`height: 30px; padding: 0 12px; border: 0; border-left: 1px solid ${t.border}; background: ${replayBg}; color: ${replayFg}; cursor: pointer`">Replay</button>
        <button type="button" @click="goSim" :aria-pressed="isSim" class="lbl" :style="`height: 30px; padding: 0 12px; border: 0; border-left: 1px solid ${t.border}; background: ${simBg}; color: ${simFg}; cursor: pointer; display: flex; align-items: center; gap: 6px`"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1 L9 5 L2 9 Z" fill="currentColor"></path></svg>Live simulation</button>
      </div>
    </div>

    <button type="button" @click="toggleFresh" :aria-expanded="freshOpen" class="lbl" :style="`height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid ${fresh.border}; background: ${fresh.bg}; color: ${fresh.fg}; cursor: pointer`">
      <template v-if="fresh.isOk"><svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 7.5 L5.5 10.5 L11.5 3.5"></path></svg></template>
      <template v-if="fresh.isBad"><svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5.5"></circle><path d="M7 4 V7.5 L9 9"></path></svg></template>
      <span>{{fresh.label}}</span>
    </button>

    <div role="group" aria-label="Time zone" :style="`display: flex; border: 1px solid ${t.border}`">
      <button type="button" @click="tzLocal" :aria-pressed="isLocal" class="lbl" :style="`height: 30px; padding: 0 10px; border: 0; background: ${tzLocalBg}; color: ${t.text}; cursor: pointer`">FI</button>
      <button type="button" @click="tzUtc" :aria-pressed="isUtc" class="lbl" :style="`height: 30px; padding: 0 10px; border: 0; border-left: 1px solid ${t.border}; background: ${tzUtcBg}; color: ${t.text}; cursor: pointer`">UTC</button>
    </div>
  </div>
</header>

<template v-if="tab === 'cr'">
<!-- Freshness dropdown -->
<template v-if="freshOpen">
<div style="position: relative; height: 0; z-index: 5">
  <div role="region" aria-label="Data freshness per source" :style="`position: absolute; right: 90px; top: 6px; width: 540px; background: ${t.surf}; border: 1px solid ${t.border}; box-shadow: ${t.shadow}; padding: 14px 16px`">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px"><strong class="lbl" :style="`font-weight: 600; color: ${t.text}`">Data freshness</strong><span class="m" :style="`font-size: 12px; color: ${t.text3}`">as known at {{asOfShort}}</span></div>
    <table style="width: 100%; border-collapse: collapse; font-size: 13px">
      <thead><tr class="lbl" :style="`color: ${t.text3}; text-align: left`"><th style="font-weight: 500; padding: 4px 0">Source</th><th style="font-weight: 500">Latest</th><th style="font-weight: 500; text-align: right">Age</th><th style="font-weight: 500; text-align: right">Expected</th><th style="font-weight: 500; text-align: right">Status</th></tr></thead>
      <tbody>
        <template v-for="s in sources">
        <tr :style="`border-top: 1px solid ${t.grid}`"><td style="padding: 6px 0">{{s.source}}</td><td class="m" :style="`font-size: 12px; color: ${t.text2}`">{{s.latest}}</td><td class="m" style="text-align: right">{{s.age}}</td><td class="m" :style="`text-align: right; color: ${t.text3}`">{{s.expected}}</td><td :style="`text-align: right; color: ${s.color}; font-weight: 500`">{{s.statusLabel}}</td></tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
</template>

<!-- Replay bar -->
<template v-if="isPast">
<div role="region" aria-label="Replay controls" :style="`display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 8px 24px; background: ${t.replayBg}; border-bottom: 1px solid ${t.acc}`">
  <span class="lbl" :style="`color: ${t.acc}; font-weight: 600`">● Replay</span>
  <span :style="`color: ${t.text2}; font-size: 13px`">Everything on screen is shown as it was known at <strong class="m" :style="`color: ${t.text}; font-weight: 600`">{{asOfLabel}}</strong></span>
  <div style="flex: 1 1 10px"></div>
  <button type="button" @click="togglePlay" :aria-label="playLabel" class="lbl" :style="`height: 30px; min-width: 84px; padding: 0 12px; border: 1px solid ${t.border}; background: ${t.surf}; color: ${t.text}; cursor: pointer`">{{playText}}</button>
  <div role="group" aria-label="Replay speed" :style="`display: flex; border: 1px solid ${t.border}`">
    <template v-for="sp in speeds">
      <button type="button" @click="sp.pick" :aria-pressed="sp.on" class="m" :style="`height: 28px; padding: 0 10px; border: 0; background: ${sp.bg}; color: ${t.text}; cursor: pointer; font-size: 12px`">{{sp.label}}</button>
    </template>
  </div>
  <label :style="`display: flex; align-items: center; gap: 6px; font-size: 13px; color: ${t.text2}; cursor: pointer`"><input type="checkbox" :checked="reveal" @change="toggleReveal" :style="`accent-color: ${t.acc}`">Reveal what actually happened</label>
</div>
</template>

<!-- Live simulation bar -->
<template v-if="isSim">
<div role="region" aria-label="Live simulation controls" :style="`display: flex; flex-direction: column; gap: 8px; padding: 10px 24px; background: ${t.replayBg}; border-bottom: 1px solid ${t.acc}`">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px">
    <span class="lbl" :style="`color: ${t.acc}; font-weight: 600`">▶ Live simulation</span>
    <span :style="`color: ${t.text2}; font-size: 13px; flex: 1 1 360px; min-width: 0`">{{sim.caption}}</span>
    <div role="group" aria-label="Playback" style="display: flex; gap: 4px">
      <button type="button" @click="sim.restart" aria-label="Restart the day" class="m" :style="`width: 36px; height: 32px; border: 1px solid ${t.border}; background: ${t.surf}; color: ${t.text}; cursor: pointer; font-size: 12px`">|◀</button>
      <button type="button" @click="sim.back15" aria-label="15 minutes back" class="m" :style="`width: 36px; height: 32px; border: 1px solid ${t.border}; background: ${t.surf}; color: ${t.text}; cursor: pointer; font-size: 14px`">‹</button>
      <button type="button" @click="sim.play" :aria-label="sim.playLabel" class="lbl" :style="`height: 32px; min-width: 112px; padding: 0 12px; border: 1px solid ${t.acc}; background: ${t.surf}; color: ${t.text}; cursor: pointer`">{{sim.playText}}</button>
      <button type="button" @click="sim.fwd15" aria-label="15 minutes forward" class="m" :style="`width: 36px; height: 32px; border: 1px solid ${t.border}; background: ${t.surf}; color: ${t.text}; cursor: pointer; font-size: 14px`">›</button>
    </div>
    <div role="group" aria-label="Simulation speed" :style="`display: flex; border: 1px solid ${t.border}`">
      <template v-for="sp in sim.speeds"><button type="button" @click="sp.pick" :aria-pressed="sp.on" class="m" :style="`height: 30px; padding: 0 10px; border: 0; background: ${sp.bg}; color: ${t.text}; cursor: pointer; font-size: 12px`">{{sp.label}}</button></template>
    </div>
    <label :style="`display: flex; align-items: center; gap: 6px; font-size: 13px; color: ${t.text2}; cursor: pointer`"><input type="checkbox" :checked="sim.pauseOnAlarm" @change="sim.togglePause" :style="`accent-color: ${t.acc}`">Pause on a new or rising alarm</label>
  </div>
  <div style="display: flex; align-items: center; gap: 10px">
    <span class="m" :style="`font-size: 12px; color: ${t.text3}`">{{sim.fromLabel}}</span>
    <input type="range" :min="sim.min" :max="sim.max" step="15" :value="sim.clock" @input="sim.scrub" aria-label="Simulation clock" :aria-valuetext="sim.clockLabel" :style="`flex: 1; min-width: 0; accent-color: ${t.acc}`">
    <span class="m" :style="`font-size: 12px; color: ${t.text3}`">{{sim.toLabel}}</span>
  </div>
  <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; font-size: 13px">
    <span class="lbl" :style="`color: ${t.text3}`">Scorecard since {{sim.fromLabel}}</span>
    <template v-for="sc in sim.score"><span><span :style="`color: ${t.text3}`">{{sc.k}}</span> <strong class="m" :style="`font-weight: 600; color: ${sc.c}`">{{sc.v}}</strong></span></template>
  </div>
  <template v-if="sim.hasNote"><div role="status" :style="`font-size: 13px; font-weight: 600; color: ${t.rev}`">{{sim.note}}</div></template>
</div>
</template>

<!-- Offline banner -->
<template v-if="offline">
<div role="alert" :style="`display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 24px; background: ${t.watch}; color: #07090C`">
  <strong style="font-weight: 600">Can't reach the forecast service since 12:03.</strong>
  <span>You are looking at the 12:00 forecast. Hindsight and replay still work from the last download.</span>
</div>
</template>

<main style="max-width: 1720px; margin: 0 auto; padding: 16px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

  <!-- ============ KPI STRIP ============ -->
  <section aria-label="Key numbers" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px">
    <template v-for="k in kpis">
      <div class="hud" :style="`background: ${t.surf}; border: 1px solid ${t.border}; padding: 10px 14px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0`">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px">
          <span class="lbl" :style="`color: ${t.text3}`">{{k.label}}</span>
          <template v-if="k.alarm"><span aria-hidden="true" class="ping" :style="`width: 8px; height: 8px; border-radius: 50%; background: ${t.rev}`"></span></template>
        </div>
        <div style="display: flex; align-items: baseline; gap: 6px; min-width: 0">
          <span class="m" :style="`font-size: 26px; font-weight: 600; line-height: 1.15; color: ${k.c}; white-space: nowrap`">{{k.value}}</span>
          <span class="m" :style="`font-size: 12px; color: ${t.text3}`">{{k.unit}}</span>
        </div>
        <span :style="`font-size: 12px; color: ${t.text2}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden`">{{k.sub}}</span>
        <template v-if="k.rangeOn">
          <div role="img" :aria-label="k.rangeAria" :style="`position: relative; height: 10px; margin-top: 6px; background: ${t.grid}`">
            <span :style="`position: absolute; top: 0; bottom: 0; left: ${k.bandL}; width: ${k.bandW}; background: ${t.border}`"></span>
            <span :style="`position: absolute; top: -3px; bottom: -3px; left: ${k.markL}; width: 3px; transform: translateX(-50%); background: ${k.markC}`"></span>
          </div>
          <span class="m" :style="`font-size: 12px; color: ${k.rangeC}; margin-top: 2px`">{{k.rangeLabel}}</span>
        </template>
      </div>
    </template>
  </section>

  <!-- ============ SITUATION ============ -->
  <section aria-label="Situation summary" class="hud" :style="`background: ${t.surf}; border: 1px solid ${t.border}; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px`">
    <span class="m" :style="`font-size: 12px; font-weight: 600; background: ${t.surf2}; color: ${t.text2}; border: 1px solid ${t.border}; padding: 0 5px`">00</span>
    <span class="lbl" :style="`color: ${t.text3}`">Situation · {{horizonLabel}}</span>
    <h1 style="margin: 0; flex: 1 1 600px; font-size: 20px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance">{{summary}}</h1>
  </section>

  <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start">

  <!-- ============ LEFT: CHARTS + DETAIL ============ -->
  <div style="flex: 999 1 720px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
  <section aria-label="Price forecast, next 10 hours" class="hud" :style="`background: ${t.surf}; border: 1px solid ${t.border}; padding: 12px 16px 12px`">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span class="m" :style="`font-size: 12px; font-weight: 600; background: ${t.surf2}; color: ${t.text2}; border: 1px solid ${t.border}; padding: 0 5px`">01</span>
        <h2 class="lbl" :style="`margin: 0; font-weight: 600; color: ${t.text}`">Imbalance price · next 10 h</h2>
        <span class="m" :style="`font-size: 12px; color: ${t.text3}`">€/MWh · 15 min</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
        <template v-if="analyst">
        <div role="group" aria-label="Past side: forecasts made this long before delivery" style="display: flex; align-items: center; gap: 6px">
          <span class="lbl" :style="`color: ${t.text3}`">Past side as forecast</span>
          <div :style="`display: flex; border: 1px solid ${t.border}`">
            <template v-for="l in leads">
              <button type="button" @click="l.pick" :aria-pressed="l.on" class="m" :style="`height: 26px; padding: 0 9px; border: 0; border-left: 1px solid ${l.sep}; background: ${l.bg}; color: ${l.fg}; cursor: pointer; font-size: 12px`">{{l.label}}</button>
            </template>
          </div>
          <span class="lbl" :style="`color: ${t.text3}`">ahead</span>
        </div>
        <label class="lbl" :style="`display: flex; align-items: center; gap: 6px; color: ${t.text3}`">Model
          <select @change="pickMainEv" class="m" :style="`height: 26px; border: 1px solid ${t.border}; background: ${t.bg}; color: ${t.text}; font-size: 12px; text-transform: none; letter-spacing: 0`">
            <template v-for="o in models"><option :value="o.id" :selected="o.on">{{o.label}}</option></template>
          </select>
        </label>
        <label class="lbl" :style="`display: flex; align-items: center; gap: 6px; color: ${t.text3}`">Compare
          <select @change="pickCmpEv" class="m" :style="`height: 26px; border: 1px solid ${t.border}; background: ${t.bg}; color: ${t.text}; font-size: 12px; text-transform: none; letter-spacing: 0`">
            <template v-for="o in cmpModels"><option :value="o.id" :selected="o.on">{{o.label}}</option></template>
          </select>
        </label>
        <button type="button" @click="toggleTable" :aria-pressed="tableOn" class="lbl" :style="`height: 26px; padding: 0 10px; border: 1px solid ${t.border}; background: ${tableBg}; color: ${t.text2}; cursor: pointer`">Table</button>
        <button type="button" @click="exportCsv" class="lbl" :style="`height: 26px; padding: 0 10px; border: 1px solid ${t.border}; background: transparent; color: ${t.text2}; cursor: pointer`">{{csvLabel}}</button>
        </template>
        <button type="button" @click="toggleAnalyst" :aria-expanded="analyst" class="lbl" :style="`height: 28px; padding: 0 10px; border: 1px solid ${t.border}; background: ${analystBg}; color: ${t.text2}; cursor: pointer`">{{analystLabel}}</button>
      </div>
    </div>

    <!-- Layer chips: the legend is the toggle -->
    <div role="group" aria-label="Chart layers" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px">
      <template v-for="ch in chips">
        <button type="button" @click="ch.toggle" :aria-pressed="ch.on" :style="`height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid ${ch.border}; background: ${ch.bg}; color: ${ch.fg}; cursor: pointer; font: inherit; font-size: 12px`">
          <span aria-hidden="true" :style="`width: 16px; height: ${ch.swH}; background: ${ch.swBg}; border-top: ${ch.swLine}; opacity: ${ch.swOp}`"></span>{{ch.label}}
        </button>
      </template>
      <template v-if="analyst">
      <span aria-hidden="true" :style="`width: 1px; height: 18px; background: ${t.border}; margin: 0 4px`"></span>
      <button type="button" @click="presetSimple" class="lbl" :style="`height: 28px; padding: 0 10px; border: 1px dashed ${t.border}; background: transparent; color: ${t.text2}; cursor: pointer`">Simple</button>
      <button type="button" @click="presetAll" class="lbl" :style="`height: 28px; padding: 0 10px; border: 1px dashed ${t.border}; background: transparent; color: ${t.text2}; cursor: pointer`">Everything</button>
      </template>
    </div>

    <!-- Readout -->
    <div aria-live="polite" :style="`display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; min-height: 36px; padding: 7px 12px; background: ${t.bg}; border: 1px solid ${t.grid}; margin-bottom: 10px; font-size: 13px`">
      <strong class="m" :style="`font-weight: 600; font-size: 13px; color: ${t.text}`">{{ro.time}}</strong>
      <span class="lbl" :style="`color: ${t.text3}`">{{ro.kind}} · click to pin, drag to select a window</span>
      <template v-for="it in ro.shown">
        <span><span :style="`color: ${t.text3}`">{{it.k}}</span> <span class="m" :style="`font-weight: 500; color: ${it.c}`">{{it.v}}</span></span>
      </template>
      <button type="button" @click="toggleRo" :aria-expanded="roMore" class="lbl" :style="`margin-left: auto; border: 0; background: none; padding: 0; color: ${t.acc}; cursor: pointer`">{{roBtn}}</button>
    </div>

    <template v-if="brushSum.on">
    <div role="region" aria-label="Selected window" :style="`display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; padding: 8px 12px; margin: -4px 0 10px; border: 1px solid ${t.brushEdge}; background: ${t.bg}; font-size: 13px`">
      <strong class="m" style="font-weight: 600">{{brushSum.label}}</strong>
      <span class="lbl" :style="`color: ${t.text3}`">window · {{brushSum.n}}</span>

<script>
const D = __DATA__;

class View { constructor(props) { this.props = props || {}; this.state = {}; }
  setState(u) { const p = typeof u === 'function' ? u(this.state) : u; if (!p) return; this.state = Object.assign({}, this.state, p); __schedule(); } }

const T = { bg:'#07090C', surf:'#0D1015', surf2:'#141920', border:'#252C36', grid:'#171C23', text:'#EDEFF2', text2:'#A9B1BC', text3:'#8A93A0',
  acc:'#FF9F43', fc:'#5AA2FF', fcGlow:'transparent', band:'rgba(90,162,255,0.16)', bandPast:'rgba(138,147,160,0.14)', act:'#F4F6F8', spot:'#8A93A0', ghost:'#7A8390',
  up:'#B794FF', down:'#2EC4B0', upSoft:'rgba(183,148,255,0.85)', downSoft:'rgba(46,196,176,0.85)', obsUp:'rgba(183,148,255,0.32)', obsDown:'rgba(46,196,176,0.32)',
  rev:'#FF5C6C', revBg:'rgba(255,92,108,0.14)', revShade:'rgba(255,92,108,0.10)', watch:'#F2D16B', watchBg:'rgba(242,209,107,0.12)', watchShade:'rgba(242,209,107,0.05)', info:'#9FB1CC', infoBg:'rgba(159,177,204,0.12)',
  hover:'rgba(237,239,242,0.06)', sel:'rgba(255,159,67,0.12)', selRing:'inset 0 0 0 1px #FF9F43', brush:'rgba(185,199,214,0.10)', brushEdge:'#B9C7D6', spread:'#4F5866', spreadHi:'#A9B1BC',
  replayBg:'#16120C', shadow:'0 14px 36px rgba(0,0,0,0.6)', ok:'#3CCB7F', hitC:'rgba(237,239,242,0.24)', none:'rgba(237,239,242,0.06)' };
// operator default: what a trader on shift needs; the rest sits behind Analyst tools
const OPERATOR_LAYERS = ['range', 'fc', 'act', 'spot', 'up', 'down', 'high', 'low'];
const LAYER_DEFAULT = { range: true, fc: true, prev: false, act: true, spot: true, vals: false, up: true, down: true, high: true, low: true, hits: false, cmp: false, spread: false, insights: true };
const LAYER_SIMPLE = { range: true, fc: true, prev: false, act: true, spot: false, vals: false, up: false, down: false, high: true, low: true, hits: true, cmp: false, spread: false, insights: true };
const LAYER_META = [
  ['range', 'Range p10–p90', 'band'], ['fc', 'Best guess', 'fc'], ['prev', 'Previous update', 'prev'], ['act', 'Actual', 'act'], ['spot', 'Spot', 'spot'], ['vals', 'Values', 'vals'],
  ['up', 'Up-regulation', 'up'], ['down', 'Down-regulation', 'down'], ['high', 'High-price risk', 'spike'], ['low', 'Low-price risk', 'low'],
  ['hits', 'Hits & misses', 'hits'], ['cmp', 'Compare', 'cmp'], ['spread', 'Model spread', 'spread'], ['insights', 'Tooltip insights', 'ins']
];
// alarm levels tuned on the folds (config/alarm_levels_<variant>.json); alert thresholds for model spread and range width
const ALARM = { high: D.alarm.high, low: D.alarm.low };
const ALERT = { spread: 43.4, width: 155.5 };
const PUB_DELAY = 90;   // minutes after a quarter-hour starts until Fingrid's price is usable (75–120 in the data)
const GATE = 60;        // intraday gate closure, minutes before delivery
const SIM = { from: 420, to: 1380 };
const setSimDay = (d) => { SIM.from = d * 1440 + 420; SIM.to = Math.min(d * 1440 + 1380, D.hi); };
setSimDay(D.dayFirst);   // live simulation: 07:00 to 23:00 of the chosen day
const SIM_SPEEDS = [[1, '1 q/s'], [4, '1 h/s'], [10, '1 day/10 s']];
const MODELS = D.modelList;
const pad = (n) => String(n).padStart(2, '0');
const eur = (v) => { const r = Math.round(v); return (r < 0 ? '−' : '') + Math.abs(r).toLocaleString('en-US'); };
const pct = (p) => Math.round(p * 100) + '%';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const YMAX = 400, YMIN = -100;   // chart scale in €/MWh (negative prices are common)
const yFrac = (v) => (clamp(v, YMIN, YMAX) - YMIN) / (YMAX - YMIN);
const spark = (vals, lo, hi) => vals.map((v, i) => (i ? 'L' : 'M') + (i / (vals.length - 1) * 100).toFixed(2) + ' ' + (19 - clamp((v - lo) / ((hi - lo) || 1), 0, 1) * 18).toFixed(2)).join(' ');

class Component extends View {
  constructor(props) {
    super(props);
    const scn = props.scenario || 'high-risk';
    const replay = scn === 'replay', simS = scn === 'simulation';
    this.state = { asOf: simS ? SIM.from : D.dayFirst * 1440 + 720, past: replay, playing: replay, speed: 1, reveal: replay, tz: 'local', sel: 43, hover: null, freshOpen: scn === 'stale', open: {}, trustOpen: false, roMore: false,
      layers: { ...LAYER_DEFAULT }, lead: 1, table: false, csvDone: false, main: 'combined_v3', cmp: 'A', tab: simS ? 'cr' : 'ov', ovFrom: D.dayFirst * 1440, ovTo: (D.dayLast + 1) * 1440, ovLead: 1, ovHover: null, ovSpot: false, hitsOpen: true, drag: null, brush: null,
      sim: simS, simPlaying: simS, simSpeed: 4, pauseOnAlarm: true, simNote: '', analyst: false, ack: {}, snooze: {}, note: '', noteAt: null, pos: '-5', expoH: 4 };
  }
  componentDidMount() { this.sync(); }
  componentDidUpdate() { this.sync(); }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
  sync() {
    const st = this.state;
    const want = st.sim && st.simPlaying ? 'sim' + st.simSpeed : st.playing && st.past ? 'rep' + st.speed : '';
    if (want === this.timerKey) return;
    if (this.timer) clearInterval(this.timer);
    this.timer = null; this.timerKey = want;
    if (!want) return;
    if (st.sim) this.timer = setInterval(() => this.simTick(), 1000 / st.simSpeed);
    else this.timer = setInterval(() => {
      this.setState((s) => ({ asOf: s.asOf + 60 > D.hi ? D.lo : s.asOf + 60 }));
    }, 1000 / st.speed);
  }
  // live simulation: the clock moves one quarter-hour per tick; a new forecast run every full hour
  simTick() {
    this.setState((s) => {
      if (!s.sim) return {};
      const n = s.asOf + 15;
      if (n > SIM.to) return { simPlaying: false, simNote: 'End of the simulated day. Press Replay day to run it again.' };
      const out = { asOf: n };
      if (n % 60 === 0 && s.pauseOnAlarm) { const why = this.newAlarm(n); if (why) { out.simPlaying = false; out.simNote = 'Paused: ' + why + '. Read the alert, then press Play.'; } }
      return out;
    });
  }
  hmOf(m) { const utc = this.state.tz === 'utc'; const mm = ((m - (utc ? 180 : 0)) % 1440 + 1440) % 1440; return pad(Math.floor(mm / 60)) + ':' + pad(mm % 60); }
  // peak spike risks of the run made at origin o, and the first quarter-hour above each alarm level
  alarmsAt(o) {
    const key = o + '|' + this.state.main + '|' + this.scn();
    this._ac = this._ac || {};
    if (this._ac[key]) return this._ac[key];
    let hi = 0, lo = 0, hiAt = -1, loAt = -1;
    for (let i = 0; i < 40; i++) { const m = o + 15 * i, f = this.fcM(m, o, this.state.main);
      if (f.hi > hi) hi = f.hi; if (f.lo > lo) lo = f.lo; if (hiAt < 0 && f.hi > ALARM.high) hiAt = m; if (loAt < 0 && f.lo > ALARM.low) loAt = m; }
    return (this._ac[key] = { hi, lo, hiAt, loAt });
  }
  // what is new in the run at o compared with the run an hour earlier: a new alarm, or a risk up 10 pp or more
  newAlarm(o) {
    const a = this.alarmsAt(o), b = this.alarmsAt(o - 60);
    if (a.hiAt >= 0 && b.hiAt < 0) return 'new high-price risk alarm from ' + this.hmOf(a.hiAt) + ' (' + pct(a.hi) + ')';
    if (a.hiAt >= 0 && a.hi >= b.hi + 0.10) return 'high-price risk up from ' + pct(b.hi) + ' to ' + pct(a.hi) + ' in the ' + this.hmOf(o) + ' run';
    if (a.loAt >= 0 && b.loAt < 0) return 'new low-price risk alarm from ' + this.hmOf(a.loAt) + ' (' + pct(a.lo) + ')';
    if (a.loAt >= 0 && a.lo >= b.lo + 0.10) return 'low-price risk up from ' + pct(b.lo) + ' to ' + pct(a.lo) + ' in the ' + this.hmOf(o) + ' run';
    return '';
  }
  scn() { return ''; }
  calm() { return false; }
  qi(m) { return (m - D.qm0) / 15; }
  spot(m) { const v = D.spot[this.qi(m)]; return v == null ? 0 : v; }
  actual(m) { const v = D.act[this.qi(m)]; return v == null ? null : v; }
  dirA(m) { const v = D.dir[this.qi(m)]; return v == null ? 0 : v; }   // Fingrid 369: 1 up, -1 down, 0 none
  spk(m) { const v = D.spk[this.qi(m)]; return v == null ? 0 : v; }   // 1 high, -1 low spike vs the real spot
  w(m) { return 0; }
  dd(m) { return 0; }
  model(id) { return MODELS.find((x) => x[0] === id) || MODELS[0]; }
  fc(m, origin) { return this.fcM(m, origin, this.state.main); }
  fcM(m, origin, id) {
    const o = origin - (((origin % 60) + 60) % 60), key = id + '|' + o + '|' + m;
    this._fc = this._fc || new Map();
    const hit = this._fc.get(key); if (hit) return hit;
    const oi = (o - D.om0) / 60, k = (m - o) / 15, a = D.models[id], s = this.spot(m);
    const lead = clamp(Math.ceil((m - origin + 1) / 60), 1, 10);
    let r;
    if (!a || oi < 0 || oi >= D.no || k < 0 || k >= 40) r = { m, lead, s, p10: s, p50: s, p90: s, up: 0, down: 0, none: 1, hi: 0, lo: 0, rmin: s, rmax: s, drivers: [], missing: true };
    else {
      const b = (oi * 40 + k) * 7, p50 = a[b + 1] / 10, up = a[b + 3] / 1000, down = a[b + 4] / 1000;
      let rmin = p50, rmax = p50;
      D.members.forEach((id2) => { const v = D.models[id2][b + 1] / 10; if (v < rmin) rmin = v; if (v > rmax) rmax = v; });
      r = { m, lead, s, p10: a[b] / 10, p50, p90: a[b + 2] / 10, up, down, none: Math.max(0, 1 - up - down), hi: a[b + 5] / 1000, lo: a[b + 6] / 1000, rmin, rmax, drivers: [] };
    }
    this._fc.set(key, r);
    return r;
  }
  y(v) { return 300 - yFrac(v) * 300; }

  renderVals() {
    const st = this.state, scn = this.scn(), t = T;
    // asOf is the clock (quarter-hours in the simulation); origin is the latest hourly forecast run
    const asOf = st.asOf, origin = asOf - (asOf % 60), prevO = origin - 60, start = asOf - 360;
    const utc = st.tz === 'utc';
    const days = D.days;
